<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng dẫn tạo Fixed Menu</title>
    <style>
        /* Đặt margin mặc định của body về 0 để menu dính sát mép màn hình */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Định dạng Fixed Header */
        .navbar {
            overflow: hidden;
            background-color: #333;
            position: fixed; /* Cố định vị trí khi cuộn trang */
            top: 0;          /* Dính ở cạnh trên cùng */
            width: 100%;     /* Phủ kín chiều rộng màn hình */
            z-index: 1000;   /* Đảm bảo menu luôn nổi trên các thành phần khác */
        }

        /* Định dạng các liên kết trong Header */
        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Định dạng vùng nội dung chính */
        .main {
            padding: 16px;
            margin-top: 50px; /* Đẩy nội dung xuống để không bị menu che mất */
            height: 1500px;   /* Tạo độ cao để làm xuất hiện thanh cuộn */
        }
    </style>
</head>
<body>

    <!-- Fixed Header -->
    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
    </div>

    <!-- Nội dung trang web -->
    <div class="main">
        <h1>Fixed Top Menu</h1>
        <h2>Scroll this page to see the effect</h2>
        <h2>The navigation bar will stay at the top of the page while scrolling</h2>
        <p>Some text some text some text some text...</p>
        <p>Some text some text some text some text...</p>
    </div>

</body>
</html>
